name: Build and deploy Powershell project to Azure Function App - cippjntam

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Deploy CIPP API to Azure Function App
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'cippjntam'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CIPPJNTAM }}
          sku: 'flexconsumption'
